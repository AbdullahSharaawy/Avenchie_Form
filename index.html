<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>شاورما الحريف المصري - طلب أونلاين</title>
    <!-- Font Awesome 6 (Free) for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
   :root {
            --font-sans: system-ui, -apple-system, 'Segoe UI', 'Tahoma', Roboto, 'Helvetica Neue', sans-serif;
            --color-background-primary: #ffffff;
            --color-background-secondary: #faf7f5;
            --color-text-primary: #2c221e;
            --color-text-secondary: #6b4c3b;
            --color-text-tertiary: #a1826f;
            --color-border-tertiary: #f0e3dc;
            --color-border-secondary: #ddcdc2;
            --border-radius-md: 8px;
            --border-radius-lg: 16px;
        }
          body {
            background: #fef7f2;
            font-family: var(--font-sans);
            padding: 1rem;
            direction: rtl;
        }
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
*{box-sizing:border-box;margin:0;padding:0}
body{direction:rtl;font-family:var(--font-sans)}
.wrap{padding:1.5rem 0}
.header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.logo{width:48px;height:48px;border-radius:var(--border-radius-lg);background:#D85A30;display:flex;align-items:center;justify-content:center;font-size:22px}
.header h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.header p{font-size:13px;color:var(--color-text-secondary)}
.section{margin-bottom:1.25rem}
.section-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.section-title i{font-size:15px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.item-row:last-child{border-bottom:none}
.item-info{flex:1}
.item-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.item-desc{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.item-price{font-size:13px;color:#993C1D;font-weight:500;margin-left:12px;min-width:60px;text-align:center}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-right:12px}
.qty-btn{width:26px;height:26px;border:0.5px solid var(--color-border-secondary);border-radius:50%;background:transparent;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--color-text-primary);transition:background .15s}
.qty-btn:hover{background:var(--color-background-secondary)}
.qty-num{font-size:14px;font-weight:500;min-width:16px;text-align:center;color:var(--color-text-primary)}
.tab-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:20px;font-size:13px;cursor:pointer;background:transparent;color:var(--color-text-secondary);transition:all .15s}
.tab.active{background:#F5C4B3;border-color:#D85A30;color:#712B13;font-weight:500}
.offer-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.offer-row:last-child{border-bottom:none}
.badge{font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);background:#FAECE7;color:#993C1D;margin-right:6px}
.delivery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;transition:all .15s}
.d-card:hover{border-color:#D85A30}
.d-card.selected{border:1.5px solid #D85A30;background:#FAECE7}
.d-city{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.d-info{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.summary{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-top:1.25rem}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-secondary);padding:3px 0}
.sum-total{display:flex;justify-content:space-between;font-size:16px;font-weight:500;color:var(--color-text-primary);border-top:0.5px solid var(--color-border-tertiary);margin-top:8px;padding-top:8px}
.sum-total span:last-child{color:#993C1D}
.input-row{margin-bottom:10px; }
.input_style{padding: 10px; }
.input-row label{font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
input[type=text],input[type=tel],textarea,select{width:100%}
textarea{height:70px;resize:vertical}
.submit-btn{width:100%;padding:11px;background:#D85A30;color:#fff;border:none;border-radius:var(--border-radius-lg);font-size:15px;font-weight:500;cursor:pointer;margin-top:1rem;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.empty-msg{font-size:13px;color:var(--color-text-tertiary);text-align:center;padding:1rem 0}
.offer-add{padding:4px 12px;border:0.5px solid #D85A30;border-radius:20px;background:transparent;color:#993C1D;font-size:12px;cursor:pointer}
.offer-add:hover{background:#FAECE7}
.success{text-align:center;padding:2rem 1rem}
.success i{font-size:48px;color:#639922;display:block;margin-bottom:12px}
.success h2{font-size:18px;font-weight:500;margin-bottom:8px}
.success p{font-size:14px;color:var(--color-text-secondary)}
</style>
</head>
<h2 class="sr-only">نموذج طلب من شاورما الحريف المصري</h2>
<div class="wrap" id="app">

<div class="header">
  <div class="logo">🌯</div>
  <div>
    <h1>شاورما الحريف المصري</h1>
    <p>سندوتشات · وجبات · مشروبات</p>
  </div>
</div>

<div class="section">
  <div class="section-title"><i class="ti ti-tool-kitchen-2" aria-hidden="true"></i> القائمة</div>
  <div class="tab-row" id="tabs"></div>
  <div class="card" id="menu-list"></div>
</div>

<div class="section">
  <div class="section-title"><i class="ti ti-tag" aria-hidden="true"></i> العروض</div>
  <div class="card" id="offers-list"></div>
</div>



<div class="section">
  <div class="section-title"><i class="ti ti-user" aria-hidden="true"></i> بياناتك</div>
  <div class="card">
    <div class="input-row"><label>الاسم</label><input class="input_style" type="text" id="cname" placeholder="اسمك الكامل"/></div>
    <div class="input-row"><label>رقم الهاتف</label><input class="input_style" type="tel" id="cphone" placeholder="01xxxxxxxxx"/></div>
    <div class="input-row"><label>العنوان بالتفصيل</label><input class="input_style" type="text" id="caddress" placeholder="الشارع، رقم المبنى..."/></div>
    <div class="input-row"><label>ملاحظات (اختياري)</label><textarea class="input_style" id="cnotes" placeholder="مثال: بدون مخلل، حار زيادة..."></textarea></div>
  </div>
</div>

<div class="summary" id="summary" style="display:none">
  <div id="sum-items"></div>
  <div class="sum-total"><span>الإجمالي</span><span id="sum-total-val"></span></div>
</div>

<button class="submit-btn" id="submit-btn" onclick="submitOrder()">
  <i class="ti ti-shopping-cart" aria-hidden="true"></i> تأكيد الطلب
</button>

</div>

<script>

let MENU = [];
let OFFERS = [];
const DELIVERY = [
  {city:'مدينة نصر',fee:20,min:100},
  {city:'مصر الجديدة',fee:25,min:100},
  {city:'المعادي',fee:30,min:120},
  {city:'التجمع الخامس',fee:35,min:150},
];

const qty = {};
let activeTab = 'شاورما';
let selectedCity = null;



function renderTabs(){
  const el = document.getElementById('tabs');
  const cats = [...new Set(MENU.map(i=>i.cat))];
    console.log(cats);
  el.innerHTML = cats.map(c=>`<button class="tab${c===activeTab?' active':''}" onclick="setTab('${c}')">${c}</button>`).join('');
}

function setTab(c){activeTab=c;renderTabs();renderMenu();}

function renderMenu(){
  const items = MENU.filter(i=>i.cat===activeTab);
  document.getElementById('menu-list').innerHTML = items.map(i=>`
    <div class="item-row">
      <div class="item-info">
        <div class="item-name">${i.name}</div>
        <div class="item-desc">${i.desc}</div>
      </div>
      <div style="display:flex;align-items:center">
        <div class="item-price">${i.price} جنيه</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${i.id}',-1)" aria-label="تقليل">−</button>
          <span class="qty-num" id="q-${i.id}">${qty[i.id]||0}</span>
          <button class="qty-btn" onclick="changeQty('${i.id}',1)" aria-label="زيادة">+</button>
        </div>
      </div>
    </div>`).join('');
}

function renderOffers(){
  document.getElementById('offers-list').innerHTML = OFFERS.map(o=>`
    <div class="offer-row">
      <div>
        <span class="badge">عرض</span>
        <span style="font-size:14px;font-weight:500;color:var(--color-text-primary)">${o.name}</span>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;margin-right:4px">${o.desc}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;color:#993C1D;font-weight:500">${o.price} جنيه</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeOfferQty('${o.id}',-1)" aria-label="تقليل">−</button>
          <span class="qty-num" id="q-${o.id}">${qty[o.id]||0}</span>
          <button class="qty-btn" onclick="changeOfferQty('${o.id}',1)" aria-label="زيادة">+</button>
        </div>
      </div>
    </div>`).join('');
}



function changeQty(id,delta){
  qty[id] = Math.max(0,(qty[id]||0)+delta);
  const el = document.getElementById('q-'+id);
  if(el) el.textContent = qty[id];
  updateSummary();
}

function changeOfferQty(id,delta){
  qty[id] = Math.max(0,(qty[id]||0)+delta);
  const el = document.getElementById('q-'+id);
  if(el) el.textContent = qty[id];
  updateSummary();
}

function selectCity(c){selectedCity=c;renderDelivery();updateSummary();}

function getOrderLines(){
  const lines=[];
  MENU.forEach(i=>{if(qty[i.id]>0)lines.push({name:i.name,qty:qty[i.id],unit:i.price,total:i.price*qty[i.id]});});
  OFFERS.forEach(o=>{if(qty[o.id]>0)lines.push({name:o.name,qty:qty[o.id],unit:o.price,total:o.price*qty[o.id]});});
  return lines;
}

function updateSummary(){
  const lines = getOrderLines();
  const sub = lines.reduce((s,l)=>s+l.total,0);
  const deliveryFee = selectedCity ? DELIVERY.find(d=>d.city===selectedCity).fee : 0;
  const total = sub + deliveryFee;
  const sumEl = document.getElementById('summary');
  const btn = document.getElementById('submit-btn');

  if(lines.length===0){sumEl.style.display='none';btn.disabled=true;return;}
  sumEl.style.display='block';
  btn.disabled=false;

  document.getElementById('sum-items').innerHTML =
    lines.map(l=>`<div class="sum-row"><span>${l.name} ×${l.qty}</span><span>${l.total} جنيه</span></div>`).join('')+
    (selectedCity?`<div class="sum-row"><span>توصيل (${selectedCity})</span><span>${deliveryFee} جنيه</span></div>`:'');
  document.getElementById('sum-total-val').textContent = total+' جنيه';
}
function generateOrderId(){
  const orderId = Math.random().toString(36).substring(2, 10).toUpperCase();

  return orderId;
}
const N8N_WEBHOOK_URL = 'https://n8n-nyez.avenchie.com/webhook/shawarma-order';

async function submitOrder(){
  const name    = document.getElementById('cname').value.trim();
  const phone   = document.getElementById('cphone').value.trim();
  const address = document.getElementById('caddress').value.trim();
  const notes   = document.getElementById('cnotes').value.trim();
  const lines   = getOrderLines();

 if(!name||!phone||!address){alert('من فضلك أكمل بياناتك (الاسم، الهاتف، العنوان)');return;}
if(lines.length===0){alert('الطلب فارغ!');return;}

const total = lines.reduce((s,l)=>s+l.total,0);

 const orderId = generateOrderId();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> جاري الإرسال...';

  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
       orderId,
          name,
        phone,
        address,
       
       
        notes:       notes || '',
       
        total:       total,
        submittedAt: new Date().toISOString(),
        items:       lines   // [{ name, qty, unit, total }, ...]
      })
    });

    if(!res.ok) throw new Error('server error');

    document.getElementById('app').innerHTML =`
      <div class="success">
        <i class="fa fa-check-circle"></i>
        <h2>تم استلام طلبك! 🎉</h2>
        <p style="margin-bottom:12px">شكراً ${name}، سيتواصل معك فريقنا على <strong>${phone}</strong> لتأكيد الطلب قريباً.</p>
        <div style="background:#f0f9e8;border:1.5px solid #639922;border-radius:12px;padding:12px 20px;display:inline-block">
          <div style="font-size:12px;color:#4a7a1a;margin-bottom:4px">رقم طلبك</div>
          <div style="font-size:22px;font-weight:700;color:#3a6010;letter-spacing:2px">${orderId}</div>
          <div style="font-size:11px;color:#4a7a1a;margin-top:4px">احتفظ بهذا الرقم للمتابعة</div>
        </div>
      </div>`;


  } catch(err) {
    alert('حدث خطأ أثناء إرسال الطلب. تأكد من اتصالك بالإنترنت وحاول مجدداً.');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-shopping-cart"></i> تأكيد الطلب';
  }
}
const MENU_WEBHOOK_URL ='https://n8n-nyez.avenchie.com/webhook/shawarma-menu';    
async function loadMenu() {
  try {
    const res  = await fetch(MENU_WEBHOOK_URL);
    const data = await res.json();
    MENU   = data.menu;
    OFFERS = data.offers.map(o => ({...o, price: Number(o.price)}));
    MENU   = MENU.map(i => ({...i, price: Number(i.price)}));
  } catch(e) {
    console.error('فشل تحميل القائمة', e);
    // fallback: hardcode a minimal menu here if needed
  } finally {
    renderTabs();
    renderMenu();
    renderOffers();
    updateSummary();
  }
}
    // At the very top of <script>, before loadMenu():
document.getElementById('menu-list').innerHTML = 
  '<div class="empty-msg"><i class="fa fa-spinner fa-spin"></i> جاري تحميل القائمة...</div>';
loadMenu();
</script>
